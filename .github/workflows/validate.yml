name: Registry validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check tools/registry.mjs
          node --check tools/validate.mjs
          node --check tools/build-index.mjs
          node --check worker/index.js
          node --check site/app.js
          node --check site/dialog-fix.js
          node --check tests/worker.test.mjs
      - name: Validate registry
        run: node tools/validate.mjs --check-index
      - name: Worker regression tests
        run: node tests/worker.test.mjs

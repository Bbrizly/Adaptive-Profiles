name: Registry validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check tools/registry.mjs
          node --check tools/validate.mjs
          node --check tools/build-index.mjs
          if [ -f worker/index.js ]; then node --check worker/index.js; fi
          if [ -f site/app.js ]; then node --check site/app.js; fi
      - name: Validate registry
        run: node tools/validate.mjs --check-index

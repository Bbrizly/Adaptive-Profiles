name: Read-only site preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare project-site assets
        shell: bash
        run: |
          rm -rf _site
          cp -R site _site
          # GitHub project Pages serves under /Adaptive-Profiles/. Production
          # Cloudflare serves at /. Only patch static asset URLs for the preview;
          # app.js detects github.io and uses hash routing + raw GitHub data.
          sed -i \
            -e 's|href="/styles.css"|href="/Adaptive-Profiles/styles.css"|g' \
            -e 's|href="/render-fixes.css"|href="/Adaptive-Profiles/render-fixes.css"|g' \
            -e 's|href="/favicon.svg"|href="/Adaptive-Profiles/favicon.svg"|g' \
            -e 's|"/brand-mark.png"|"/Adaptive-Profiles/brand-mark.png"|g' \
            -e 's|src="/dialog-fix.js"|src="/Adaptive-Profiles/dialog-fix.js"|g' \
            -e 's|src="/app.js"|src="/Adaptive-Profiles/app.js"|g' \
            _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
